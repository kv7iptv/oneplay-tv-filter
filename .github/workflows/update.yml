
name: Atualizar lista OnePlay

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-lista-oneplay
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar filtro da lista
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: python filter.py

      - name: Publicar lista atualizada
        run: |
          if git diff --quiet -- docs/oneplay.m3u; then
            echo "A lista nao teve alteracoes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/oneplay.m3u
          git commit -m "Atualiza lista OnePlay"
          git push
          
